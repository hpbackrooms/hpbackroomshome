<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
  />
  <title>Homeplus Backrooms Main</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <dialog id="uniform">
    <button id="close">닫기</button>

    <img src="img/jihouniform.png">
    <img src="img/geonwoouniform.png">
  </dialog>

  <dialog id="signupModal">
    <button id="closeSignup">닫기</button>

    <input id="signupUsername" placeholder="Enter Username">
    <input id="signupPassword" type="password" placeholder="Enter Password">

    <button id="signup">회원가입</button>
  </dialog>

  <dialog id="loginModal">
    <button id="closeLogin">닫기</button>

    <input id="loginUsername" placeholder="Enter Username">
    <input id="loginPassword" type="password" placeholder="Enter Password">

    <button id="login">로그인</button>
  </dialog>

  <h1 id="header">Homeplus Backrooms</h1>

  <p>HP Backrooms 구단 공식 홈페이지에 오신 것을 환영합니다.</p>

  <div id="signButton">
    <button id="openSignup">회원가입</button>
    <button id="openLogin">로그인</button>
  </div>

  <a href="https://www.instagram.com/hpbackroomsbaseballclub_/">• 구단 공식 인스타그램 페이지</a>
  <br>
  <a href="https://www.instagram.com/ryzen67s_baseball_club_/">• Ryzen 67s 인스타그램 페이지</a>
  <br>

  <button id="openUniform">유니폼 둘러보기</button>

  <div id="community">
    <h2 id="communityHeader">커뮤니티</h2>
    
    <div id="postList">
      게시글을 불러오는 중...
    </div>
  </div>

  <dialog id="postDialog">
    <button id="closePost">닫기</button>
<h2 id="postTitle"></h2>
<p id="postAuthor"></p>
<p id="postDate"></p>
<hr>
<p id="postContent"></p>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
